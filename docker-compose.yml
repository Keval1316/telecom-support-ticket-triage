version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telecom-triage-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/backend/telecom_triage.db
      - CONFIDENCE_THRESHOLD=0.85
    volumes:
      - ./backend/telecom_triage.db:/app/backend/telecom_triage.db
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telecom-triage-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
